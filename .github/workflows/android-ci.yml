name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-36" "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify packaged C++ runtime
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libc++_shared.so"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libc++_shared.so"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: conshite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
