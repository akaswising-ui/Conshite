name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: conshite-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-emulator-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Conshite and pinned PPSSPP source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 for the embedded game controller
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Python game controller
        run: python -m unittest discover -s tools/tests -v

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build Java GameHub and C++ PSP emulator
        run: gradle --no-daemon --stacktrace :app:assembleNormalDebug

      - name: Verify native emulator and shared C++ runtime
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/normal/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -f "$APK"
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$ABI/libppsspp_jni.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libconshite_native.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libc++_shared.so"
            unzip -l "$APK" | grep -q "lib/$ABI/libpython3.11.so"
          done
          echo "Verified PPSSPP, Conshite C++ bridge, c++_shared, and embedded Python 3.11 for both configured ABIs."

      - name: Upload Conshite debug APK
        uses: actions/upload-artifact@v4
        with:
          name: conshite-psp-debug-apk
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
