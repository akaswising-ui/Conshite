name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Conshite and pinned PPSSPP source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build Java frontend and native C++ emulator
        run: gradle --no-daemon --stacktrace :app:assembleNormalDebug

      - name: Verify emulator libraries and shared C++ runtime
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/normal/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libppsspp_jni.so"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libppsspp_jni.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libc++_shared.so"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libc++_shared.so"
          echo "Verified native emulator and c++_shared for both Android ABIs."

      - name: Upload Conshite debug APK
        uses: actions/upload-artifact@v4
        with:
          name: conshite-psp-debug-apk
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
